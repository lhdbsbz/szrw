name: ci

on:
  push:
  pull_request:

jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go build ./...
      - run: go vet ./...

  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: template/go.mod
          check-latest: true
      # 模板是「新项目只需要写 proto」的活证明：生成物已提交，这里只验证能编译。
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
